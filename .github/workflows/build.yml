name: Build APK

on:
  push:
    # Development branches build too. Until now only main did, which meant a
    # change could not be compiled or installed until it had already been
    # merged - and there is no Android SDK on the machine this is written on,
    # so this workflow is the only thing that compiles the Kotlin at all.
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to publish the release below. Nothing else here writes.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TVMonitor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVMonitor-APK
          path: app/build/outputs/apk/debug/TVMonitor.apk

      # A rolling release, so the phone has one address that always holds the
      # current build.
      #
      # The artifact above is the wrong shape for the person actually installing
      # this. Downloading one needs a signed-in GitHub account and arrives as a
      # zip that has to be extracted before Android will look at it - every time,
      # on a phone. A release asset is a direct .apk link that needs no account
      # and installs on tap.
      #
      # Marked as a prerelease because that is what it is: an unsigned debug
      # build of a development branch.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-${GITHUB_REF_NAME//\//-}"
          # Recreated rather than edited: re-uploading an asset of the same name
          # onto an existing release fails, and a stale APK on a tag called
          # "latest" is worse than no release at all.
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            app/build/outputs/apk/debug/TVMonitor.apk \
            --title "Latest build - $GITHUB_REF_NAME" \
            --notes "Debug build of \`$GITHUB_SHA\`. Unsigned; allow install from unknown sources." \
            --prerelease \
            --target "$GITHUB_SHA"
