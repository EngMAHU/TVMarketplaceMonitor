name: Build APK

on:
  push:
    # Development branches build too. Until now only main did, which meant a
    # change could not be compiled or installed until it had already been
    # merged - and there is no Android SDK on the machine this is written on,
    # so this workflow is the only thing that compiles the Kotlin at all.
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed to publish the release below.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TVMonitor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVMonitor-APK
          path: app/build/outputs/apk/debug/TVMonitor.apk

      # The artifact above is only reachable by signing in to GitHub and
      # downloading a zip, which a phone cannot install without unpacking it
      # first. That is the step the trader kept getting stuck on, and it is
      # between every fix and the phone it is meant to fix.
      #
      # A release asset is a plain file on a public repository: one tap in the
      # phone's browser downloads TVMonitor.apk itself, ready to install. The
      # tag moves with each build, so /releases/latest/download/TVMonitor.apk
      # is a permanent address for the newest one and never has to be looked up
      # again.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'NOTES'
          **Install on the phone:** tap `TVMonitor.apk` below. Android will ask
          whether to allow installing from the browser - allow it, then open the
          app when it finishes.

          Installing over the top keeps the Facebook login and the listings
          already found.
          NOTES
          echo "" >> notes.md
          echo "Built from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`)." >> notes.md

          gh release create "build-${{ github.run_number }}" \
            app/build/outputs/apk/debug/TVMonitor.apk \
            --target "${GITHUB_SHA}" \
            --title "TV Monitor - build ${{ github.run_number }}" \
            --notes-file notes.md
